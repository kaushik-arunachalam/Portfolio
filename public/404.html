<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Kaushik Arunachalam</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600&family=IBM+Plex+Sans:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #0A0E16;
        --text: #EEF1F7;
        --text-muted: #A8B0C4;
        --accent: #E3A857;
        --accent-dim: #C1893D;
        --line: #252D42;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        background: var(--ink);
        color: var(--text);
        font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
        background-image: radial-gradient(
          ellipse 80% 50% at 50% -5%,
          rgba(227, 168, 87, 0.12) 0%,
          transparent 65%
        );
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      p.code {
        margin: 0 0 12px;
        font-family: 'IBM Plex Mono', monospace;
        font-size: 14px;
        color: var(--accent);
        letter-spacing: 0.04em;
      }
      h1 {
        margin: 0 0 16px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: clamp(28px, 5vw, 40px);
      }
      p.desc {
        margin: 0 0 32px;
        max-width: 44ch;
        color: var(--text-muted);
        line-height: 1.6;
      }
      a.home {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 6px;
        padding: 11px 22px;
        background: var(--accent);
        color: var(--ink);
        font-weight: 500;
        text-decoration: none;
        transition: background 0.2s;
      }
      a.home:hover { background: var(--accent-dim); }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn't exist</h1>
      <p class="desc">
        The page you're looking for isn't here. Head back to the homepage to find what you need.
      </p>
      <a class="home" href="/">Back to homepage</a>
    </main>
  </body>
</html>
